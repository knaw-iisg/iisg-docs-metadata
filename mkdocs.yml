site_name: IISG Data Services
site_description: Documentation for harvesting and querying the collections of the International Institute of Social History
repo_url: https://github.com/knaw-iisg/iisg-docs-metadata
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Service URLs, used in the pages as {{ sparql_endpoint }} etc. Change a
# domain here only. examples/oai_to_sparql.py carries its own copy of
# sparql_endpoint; CI fails if the two differ.
extra:
  sparql_endpoint: https://sparql.zijdeman.nl
  query_ui: https://kg.zijdeman.nl
  kb_viewer: https://kb.zijdeman.nl

plugins:
  - search
  - macros

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Overview: index.md
  - Tutorials:
      - OAI-PMH: tutorials/oai-pmh.md
  - Reference:
      - OAI-PMH endpoint: reference/oai-pmh.md
      - Knowledge graph IRIs: reference/iris.md
